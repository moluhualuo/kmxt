server {
    listen 80;
    listen [::]:80;
    server_name kmxt.moluhualuo.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kmxt.moluhualuo.top;

    ssl_certificate /etc/letsencrypt/live/kmxt.moluhualuo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kmxt.moluhualuo.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # 作者花落：将误发到 TLS 端口的明文 HTTP 请求纠正为标准 HTTPS。
    error_page 497 =301 https://kmxt.moluhualuo.top$request_uri;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 1m;
    limit_req zone=kmxt_per_client burst=120 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
